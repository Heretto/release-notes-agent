name: hop-core Integration

# Guards this app's integration with hop-core, which is consumed as a versioned artifact
# (a pinned git tag for the Python package, a pinned release tarball for @heretto/hop-ui).
#
# Two things are checked:
#   1. `pip check` — hop-core is the single source of truth for the versions of its own
#      dependencies (auth, crypto, oauth, rate-limiting, lxml, pydantic-settings, etc.),
#      so this fails if an app pin violates one of hop-core's constraints.
#   2. `hop-doctor` — hop-core's own auditor for the integration failures documented in
#      https://github.com/Heretto/hop-core/blob/main/AGENTS.md: dependencies referenced by
#      filesystem path, the theme imported from hop-core's source tree, Angular's
#      inlineCritical combined with a CSP that silently disables the stylesheet, compose
#      build contexts with no Dockerfile, and missing or invalid required settings.

on:
  pull_request:
    paths:
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - 'frontend/package.json'
      - 'frontend/angular.json'
      - 'frontend/tsconfig.json'
      - 'frontend/src/styles/**'
      - 'docker-compose*.yml'
      - 'deployment/**'
      - '.github/workflows/deps-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - 'frontend/package.json'
      - 'frontend/angular.json'
      - 'frontend/tsconfig.json'
      - 'frontend/src/styles/**'
      - 'docker-compose*.yml'
      - 'deployment/**'
      - '.github/workflows/deps-check.yml'
  # Run on demand, and weekly so a hop-core release that breaks this app's pins is caught
  # even without a commit here.
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      # A single checkout, deliberately. hop-core resolves from its pinned release, so if
      # anything here still needs a sibling checkout to build, that is the bug this catches.
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Audit hop-core integration
        run: hop-doctor --json

      - name: Audit hop-core integration (human-readable, includes warnings)
        if: always()
        run: hop-doctor --strict || true
