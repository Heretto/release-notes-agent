server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /api {
        # A DTD-set upload goes up to DTD_UPLOAD_MAX_MB (50 by default). nginx stops at 1 MB
        # and answers 413 before the app sees the request, so this has to be at least as
        # high; deployment/nginx-production.conf.template already allows 100M.
        client_max_body_size 100M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}